  <style>
:root {
  --bg1: #7dd3fc;
  --bg2: #c4b5fd;
  --card: #ffffff;
  --ink: #33324a;
  --ink-soft: #6b6a85;
  --primary: #ff8a3d;
  --primary-dark: #f2702a;
  --ok: #22c55e;
  --no: #ef4444;
  --line: #e9e7f5;
  --radius: 28px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  /* 차 안에서도 인터넷 없이 떠야 하므로 웹폰트를 쓰지 않는다 */
  font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, sans-serif;
  font-weight: 700;
  color: var(--ink);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 16px 96px;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 26px 20px;
  box-shadow: 0 14px 30px rgba(60, 50, 120, 0.18);
}

.center { text-align: center; }

.hero {
  font-size: 84px;
  line-height: 1.1;
  margin-bottom: 6px;
}

.title {
  font-size: 34px;
  margin: 6px 0 4px;
}

.ask {
  font-size: 30px;
  margin: 0 0 20px;
  text-align: center;
  line-height: 1.35;
}

.sub {
  font-size: 19px;
  color: var(--ink-soft);
  margin: 6px 0 20px;
  line-height: 1.5;
}

.step {
  text-align: center;
  font-size: 18px;
  color: var(--primary-dark);
  margin: 0 0 6px;
}

/* ---- 버튼 ---- */

.btn {
  display: block;
  width: 100%;
  border: none;
  border-radius: 20px;
  padding: 18px 20px;
  font-family: inherit;
  font-size: 24px;
  color: #fff;
  background: var(--primary);
  box-shadow: 0 6px 0 var(--primary-dark);
  cursor: pointer;
  margin-top: 14px;
  transition: transform 0.08s ease;
}

.btn.big { font-size: 28px; padding: 22px 20px; }

// 설정 저장. 파일(file://)로 열거나 시크릿 모드면 브라우저가 localStorage를 막고
// 접근만 해도 예외를 던진다. 그때도 앱은 그냥 돌아가야 하므로 전부 감싸 둔다.
const Store = (function () {
  function get(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  }

  function set(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch {
      /* 저장은 못 하지만 이번 판은 계속 놀 수 있다 */
    }
  }

  function remove(key) {
    try {
      localStorage.removeItem(key);
    } catch {
      /* 무시 */
    }
  }

  return { get, set, remove };
})();

// 숫자를 소리 내어 읽었을 때 받침이 있는지 (1 일, 3 삼, 6 육, 7 칠, 8 팔, 0 영/십)
const DIGIT_BATCHIM = {
  "0": true, "1": true, "2": false, "3": true, "4": false,
  "5": false, "6": true, "7": true, "8": true, "9": false
};

function hasBatchim(word) {
  const last = String(word).slice(-1);
  if (last >= "0" && last <= "9") return DIGIT_BATCHIM[last];
  const code = last.charCodeAt(0);
  const isHangul = code >= 0xac00 && code <= 0xd7a3;
  return isHangul && (code - 0xac00) % 28 !== 0;
}

// 받침 유무에 따라 조사를 골라준다. pair 예: "은는", "이가", "을를"
function particle(word, pair) {
  return hasBatchim(word) ? pair[0] : pair[1];
}

// "~로" / "~으로" (받침이 없거나 ㄹ이면 '로')
function roParticle(word) {
  const code = String(word).slice(-1).charCodeAt(0);
  const isHangul = code >= 0xac00 && code <= 0xd7a3;
  if (!isHangul) return "로";
  const batchim = (code - 0xac00) % 28;
  return batchim === 0 || batchim === 8 ? "로" : "으로";
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(items) {
  const a = [...items];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pick(items) {
  return items[randInt(0, items.length - 1)];
}

function pickMany(items, n) {
  return shuffle(items).slice(0, n);
}

// 정답 주변의 숫자로 보기를 만든다.
function numberChoices(answer, min, max, n) {
  const candidates = new Set();
  for (let gap = 1; gap <= 5 && candidates.size < 12; gap++) {
    if (answer - gap >= min) candidates.add(answer - gap);
    if (answer + gap <= max) candidates.add(answer + gap);
  }
  const distractors = shuffle([...candidates]).slice(0, n - 1);
  const values = shuffle([answer, ...distractors]);
  return { choices: values.map(String), answer: values.indexOf(answer) };
}

function repeatEmoji(emoji, count) {
  return Array.from({ length: count }, () => `<span>${emoji}</span>`).join("");
}

// ---- 문제 생성기 ----

function qCount(max) {
  const thing = pick(THINGS);
  const n = randInt(1, max);
  const { choices, answer } = numberChoices(n, 1, Math.max(max + 2, 6), 3);
  return {
    kind: "count",
    prompt: `모두 몇 ${thing.unit}일까요?`,
    visual: repeatEmoji(thing.emoji, n),
    visualClass: "visual-emoji",
    choices,
    answer,
    choiceStyle: "number",
    key: `count-${thing.name}-${n}`
  };
}

function qColorFind() {
  const options = pickMany(COLORS, 4);
  const target = pick(options);
  return {
    kind: "colorFind",
    prompt: `${target.name}${particle(target.name, "은는")} 어디 있을까요?`,
    visual: "🎨",
    visualClass: "visual-emoji",
    choices: options,
    answer: options.indexOf(target),
    choiceStyle: "color",
    key: `colorFind-${target.name}`
  };
}

function qColorName() {
  const options = pickMany(COLORS, 3);
  const target = pick(options);
  return {
    kind: "colorName",
    prompt: "이건 무슨 색일까요?",
    visual: `<span class="swatch-big" style="background:${target.hex}"></span>`,
    visualClass: "visual-swatch",
    choices: options.map((c) => c.name),
    answer: options.indexOf(target),
    choiceStyle: "text",

}

function qShapeName() {

function qCompare(max) {
  const thing = pick(THINGS);
  let left = randInt(1, max);
  let right = randInt(1, max);
  while (left === right) right = randInt(1, max);
  const groups = [repeatEmoji(thing.emoji, left), repeatEmoji(thing.emoji, right)];
  return {
    kind: "compare",
    prompt: "어느 쪽이 더 많을까요?",
    visual: null,
    choices: groups,
    answer: left > right ? 0 : 1,
    answerLabel: left > right ? "왼쪽" : "오른쪽",
    choiceStyle: "group",
    key: `compare-${thing.name}-${left}-${right}`
  };
}

function qNumberFind(max) {
  const target = randInt(1, max);
  const { choices, answer } = numberChoices(target, 1, max + 2, 3);
  return {
    kind: "numberFind",
    prompt: `숫자 ${target}${particle(target, "은는")} 어디 있을까요?`,
    visual: "🔢",
    visualClass: "visual-emoji",
    choices,
    answer,
    choiceStyle: "number",
    key: `numberFind-${target}`
  };
}

function qAddVisual(max) {
  const thing = pick(THINGS);
  const a = randInt(1, Math.max(1, max - 1));
  const b = randInt(1, max - a);
  const sum = a + b;
  const { choices, answer } = numberChoices(sum, 1, max + 3, 3);
  return {
    kind: "addVisual",
    prompt: `${thing.name} ${a}${thing.unit}에 ${b}${thing.unit}를 더하면 모두 몇 ${thing.unit}일까요?`,
    visual: `${repeatEmoji(thing.emoji, a)}<span class="op">＋</span>${repeatEmoji(thing.emoji, b)}`,
    visualClass: "visual-emoji",
    choices,
    answer,
    choiceStyle: "number",
    key: `addVisual-${a}-${b}`
  };
}

function qAdd(max) {
  const a = randInt(1, max - 1);
  const b = randInt(1, max - a);
  const sum = a + b;
  const { choices, answer } = numberChoices(sum, 1, max + 5, 4);
  return {
    kind: "add",
    prompt: `${a} 더하기 ${b}${particle(b, "은는")} 얼마일까요?`,
    visual: `<span class="calc">${a} + ${b} = ?</span>`,
    visualClass: "visual-calc",
    choices,
    answer,
    choiceStyle: "number",
    key: `add-${a}-${b}`
  };
}

function qSub(max) {
  const a = randInt(2, max);
  const b = randInt(1, a - 1);
  const diff = a - b;
  const { choices, answer } = numberChoices(diff, 0, max, 4);
  return {
    kind: "sub",
    prompt: `${a} 빼기 ${b}${particle(b, "은는")} 얼마일까요?`,
    visual: `<span class="calc">${a} − ${b} = ?</span>`,
    visualClass: "visual-calc",
    choices,
    answer,
    choiceStyle: "number",
    key: `sub-${a}-${b}`
  };
}

function qMultiply(maxTable) {
  const tables = maxTable <= 5 ? [2, 5] : [2, 3, 4, 5, 6, 7, 8, 9];
  const a = pick(tables);
  const b = randInt(2, 9);
  const product = a * b;
  const { choices, answer } = numberChoices(product, 2, product + 12, 4);
  return {
    kind: "multiply",
    prompt: `${a} 곱하기 ${b}${particle(b, "은는")} 얼마일까요?`,
    visual: `<span class="calc">${a} × ${b} = ?</span>`,
    visualClass: "visual-calc",
    choices,
    answer,
    choiceStyle: "number",
    key: `multiply-${a}-${b}`
  };
}

function qSequence(max, step) {
  const gap = step || 1;
  const start = randInt(1, Math.max(1, max - gap * 4));
  const series = [0, 1, 2, 3, 4].map((i) => start + i * gap);
  const hideAt = randInt(1, 3);
  const target = series[hideAt];
  const shown = series
    .map((n, i) => (i === hideAt ? `<span class="blank">?</span>` : `<span>${n}</span>`))
    .join("");
  const { choices, answer } = numberChoices(target, 1, max + gap * 2, 3);
  return {
    kind: "sequence",
    prompt: "빈칸에 들어갈 숫자는 무엇일까요?",
    visual: `<span class="series">${shown}</span>`,
    visualClass: "visual-series",
    choices,
    answer,
    choiceStyle: "number",
    key: `sequence-${start}-${gap}-${hideAt}`
  };
}

function qBigger(max) {
  const a = randInt(1, max);
  let b = randInt(1, max);
  while (a === b) b = randInt(1, max);
  const values = [a, b];
  return {
    kind: "bigger",
    prompt: "어느 숫자가 더 클까요?",
    visual: null,
    choices: values.map(String),
    answer: a > b ? 0 : 1,
    choiceStyle: "number",
    key: `bigger-${a}-${b}`
  };
}

// ---- 나이별 난이도 ----

function generatorsForAge(age) {
  if (age <= 4) {
    return [
      () => qCount(5),
      () => qColorFind(),
      () => qShapeFind(),
      () => qCompare(4),
      () => qNumberFind(5),
      () => qColorName()
    ];
  }
  if (age <= 6) {
    return [
      () => qCount(10),
      () => qAddVisual(8),
      () => qCompare(8),
      () => qColorName(),
      () => qShapeName(),
      () => qSequence(10, 1),
      () => qBigger(10)
    ];
  }
  if (age <= 8) {
    return [
      () => qAdd(20),
      () => qSub(20),
      () => qSequence(20, pick([1, 2])),
      () => qBigger(50),
      () => qCount(15),
      () => qMultiply(5)
    ];
  }
  return [
    () => qAdd(100),
    () => qSub(100),
    () => qMultiply(9),
    () => qSequence(50, pick([2, 3, 5])),
    () => qBigger(100)
  ];
}

// 고정 문제 은행에서 나이에 맞는 문제를 고른다.
function curatedForAge(age) {
  return QUESTION_BANK
    .filter((q) => Math.abs(q.age - age) <= 1)
    .map((q) => ({
      kind: "curated",
      prompt: q.question,
      visual: "🤔",
      visualClass: "visual-emoji",
      choices: q.choices,
      answer: q.answer,
      choiceStyle: "text",
      key: `curated-${q.question}`
    }));
}

// 한 사람이 풀 문제 묶음을 만든다.
function buildQuiz(age, count) {
  const total = count || 5;
  const curatedWanted = age <= 4 ? 1 : 2;
  const curated = pickMany(curatedForAge(age), curatedWanted);
  const generators = generatorsForAge(age);
  const used = new Set(curated.map((q) => q.key));
  const generated = [];

  let guard = 0;
  while (generated.length < total - curated.length && guard < 200) {
    guard++;
    const q = pick(generators)();
    if (used.has(q.key)) continue;
    used.add(q.key);
    generated.push(q);
  }

  const quiz = shuffle([...curated, ...generated]).slice(0, total);
  // 어린 나이는 숫자 보기에 점 개수를 함께 보여준다.
  quiz.forEach((q) => {
    q.dots = age <= 5 && q.choiceStyle === "number";
  });
  return quiz;
}

// 한 문제만 필요할 때. 가끔 상식 문제를 섞는다.
function buildSingleQuestion(age) {
  if (Math.random() < 0.3) {
    const pool = curatedForAge(age);
    if (pool.length) return pick(pool);
  }
  const q = pick(generatorsForAge(age))();
  q.dots = age <= 5 && q.choiceStyle === "number";
  return q;
}

// 다같이 푸는 보너스 문제는 가장 큰 아이 기준으로 만든다.
function buildBonus(maxAge) {
  const generators = generatorsForAge(maxAge);
  const q = pick(generators)();
  q.dots = maxAge <= 5 && q.choiceStyle === "number";
  return q;
}

// 첫 글자로 찾아보기 위한 색인
const WORD_BY_FIRST = WORD_CHAIN.reduce((map, word) => {
  const first = word[0];
  (map[first] = map[first] || []).push(word);
  return map;
}, {});

// 이 낱말 다음에 이어 붙일 수 있는 낱말들
function chainOptions(word, used) {
  const last = word[word.length - 1];
  return (WORD_BY_FIRST[last] || []).filter((w) => w !== word && !(used || []).includes(w));
}

// 다음 말이 또 있는(놀이가 이어지는) 낱말을 우선 고른다.
function chainPick(word, used) {
  const options = chainOptions(word, used);
  if (!options.length) return null;
  const alive = options.filter((w) => chainOptions(w, [...(used || []), w]).length > 0);
  return pick(alive.length ? alive : options);
}

// 두 번 이상 이어갈 수 있는 낱말로 시작한다.
function chainStartWord(used) {
  const candidates = WORD_CHAIN.filter((word) => {
    const next = chainOptions(word, used);
    return next.some((w) => chainOptions(w, [...(used || []), w]).length > 0);
  });
  return pick(candidates);
}

// 소리로 듣고 세는 셈. 어린 아이는 "세 개" 처럼 우리말 수로 읽어 준다.
function listenCountAdd(age) {
  const thing = pick(THINGS);
  const max = age <= 5 ? 5 : 9;
  const a = randInt(1, max - 1);
  const b = randInt(1, Math.min(max - a, 4));
  const sum = a + b;
  const wrong = shuffle([sum + 1, sum - 1, sum + 2].filter((n) => n > 0 && n !== sum && n <= 10)).slice(0, 2);
  const values = shuffle([sum, ...wrong]);
  return {
    kind: "listenCount",
    prompt: `${thing.name}${particle(thing.name, "이가")} ${countWord(a, thing.unit)} 있는데 ${countWord(b, thing.unit)}를 더 주면 모두 몇 ${thing.unit}일까요?`,
    choices: values.map((n) => countWord(n, thing.unit)),
    answer: values.indexOf(sum),
    choiceStyle: "text",
    audio: true,
    key: `listenCount-${thing.name}-${a}-${b}`
  };
}

function listenNumberNext(age) {
  if (age <= 6) {
    const start = randInt(1, 5);
    const answer = start + 3;
    // 방금 부른 수를 함정으로 쓸 때도, 아예 다음 수들로만 낼 때도 있다
    const distractors = Math.random() < 0.5 ? [answer - 1, answer + 1] : [answer + 1, answer + 2];
    const options = shuffle([answer, ...distractors]);
    return {
      kind: "listenNext",
      prompt: `${NATIVE_NUMBER[start]}, ${NATIVE_NUMBER[start + 1]}, ${NATIVE_NUMBER[start + 2]} 다음은 무엇일까요?`,
      choices: options.map((n) => NATIVE_NUMBER[n] || String(n)),
      answer: options.indexOf(answer),
      choiceStyle: "text",
      audio: true,
      key: `listenNext-${start}`
    };
  }
  const step = pick([2, 5, 10]);
  const start = step * randInt(1, 4);
  const answer = start + step * 3;
  const options = shuffle([answer, answer + step, answer - step]);
  return {
    kind: "listenNext",
    prompt: `${start}, ${start + step}, ${start + step * 2} 다음은 무엇일까요?`,
    choices: options.map(String),
    answer: options.indexOf(answer),
    choiceStyle: "text",
    audio: true,
    key: `listenNextBig-${start}-${step}`
  };
}

function listenMath(age) {
  const max = age <= 6 ? 10 : (age <= 8 ? 20 : 100);
  const plus = Math.random() < 0.6;
  let a, b, result;
  if (plus) {
    a = randInt(1, max - 1);
    b = randInt(1, max - a);
    result = a + b;
  } else {
    a = randInt(2, max);
    b = randInt(1, a - 1);
    result = a - b;
  }
  const gap = max > 20 ? 10 : 1;
  const options = shuffle([result, result + gap, Math.max(0, result - gap)]);
  return {
    kind: "listenMath",
    prompt: plus
      ? `${a} 더하기 ${b}${particle(b, "은는")} 얼마일까요?`
      : `${a} 빼기 ${b}${particle(b, "은는")} 얼마일까요?`,
    choices: [...new Set(options)].map(String),
    answer: [...new Set(options)].indexOf(result),
    choiceStyle: "text",
    audio: true,
    key: `listenMath-${a}-${b}-${plus}`
  };
}

// 영어를 듣고 우리말 뜻 고르기
function listenEnToKo() {
  const options = pickMany(EN_WORDS, 3);
  const target = pick(options);
  return {
    kind: "listenEnToKo",
    prompt: `"${target.en}"! 무슨 뜻일까요?`,
    speakParts: [
      { text: target.en, lang: "en" },
      { text: "무슨 뜻일까요?", lang: "ko" }
    ],
    choices: options.map((w) => w.ko),
    answer: options.indexOf(target),
    choiceStyle: "text",
    audio: true,
    key: `enToKo-${target.en}`
  };
}

// 우리말을 듣고 영어 단어 고르기
function listenKoToEn() {
  const options = pickMany(EN_WORDS, 3);
  const target = pick(options);
  return {
    kind: "listenKoToEn",
    prompt: `${target.ko}${particle(target.ko, "은는")} 영어로 뭘까요?`,
    choices: options.map((w) => w.en),
    answer: options.indexOf(target),
    choiceStyle: "text",
    choiceLang: "en",
    audio: true,
    key: `koToEn-${target.en}`
  };
}

function buildListenQuestion(age) {
  const builders = [listenAnimalSound, listenOpposite, listenRiddle, () => listenNumberNext(age)];
  if (age <= 6) builders.push(() => listenCountAdd(age));   // 어린 아이는 우리말 수로 세기
  if (age >= 6) builders.push(() => listenMath(age), () => listenMath(age));
  return pick(builders)();
}

function buildListenEnglishQuestion() {
  return pick([listenEnToKo, listenKoToEn])();
}

// 음성 안내(TTS).
// 기기에 깔린 목소리 중 가장 자연스러운 것을 골라 쓰고, 긴 문장은 끊어 읽어 사람처럼 들리게 한다.
// say("안녕") 또는 say([{ text: "dog", lang: "en" }, "강아지예요"], "happy") 형태로 호출한다.
const Speech = (function () {
  const synth = window.speechSynthesis || null;
  const MUTE_KEY = "kidsquiz.muted";
  const VOICE_KEY = "kidsquiz.voice";

  let muted = Store.get(MUTE_KEY) === "1";
  let allVoices = [];
  const chosen = { ko: null, en: null };

  // 목소리 이름으로 품질을 짐작한다. (기기가 품질을 알려 주지 않는다)
  const HIGH = /(premium|enhanced|natural|neural|wavenet|studio|고품질)/i;
  const NAMED = /(yuna|유나|siri|nari|sora|jimin|서현|지민)/i;
  const LOW = /(compact|espeak|eloquence|novelty|robot)/i;

  function scoreVoice(voice) {
    const name = voice.name || "";
    let score = 0;
    if (HIGH.test(name)) score += 12;
    if (NAMED.test(name)) score += 6;
    if (/google/i.test(name)) score += 5;
    if (LOW.test(name)) score -= 12;
    if (voice.localService) score += 2;   // 차 안에서 인터넷 없이도 나오는 목소리
    if (voice.default) score += 1;
    return score;
  }

  function byLang(prefix) {
    return allVoices.filter((v) => (v.lang || "").toLowerCase().startsWith(prefix));
  }

  function best(list) {
    return list.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a))[0] || null;
  }

  function pickVoices() {
    if (!synth) return;
    allVoices = synth.getVoices() || [];
    const saved = Store.get(VOICE_KEY);
    const korean = byLang("ko");
    chosen.ko = korean.find((v) => v.name === saved) || best(korean) || null;
    chosen.en = best(byLang("en")) || null;
  }

  if (synth) {
    pickVoices();
    synth.addEventListener("voiceschanged", pickVoices);
  }

  // 말투. 기계음처럼 들리지 않게 높낮이는 과하지 않게 둔다.
  const TONES = {
    normal: { rate: 0.97, pitch: 1.03 },
    warm: { rate: 0.9, pitch: 1.0 },     // 이야기하듯 천천히
    happy: { rate: 1.0, pitch: 1.16 },   // 칭찬할 때
    gentle: { rate: 0.93, pitch: 1.06 }  // 다독일 때
  };

  const EMOJI = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;

  function clean(text) {
    return String(text).replace(EMOJI, " ").replace(/\s+/g, " ").trim();
  }

  // 마침표·물음표에서 끊어 읽으면 한 호흡에 쏟아내지 않아 훨씬 자연스럽다.
  function toChunks(text) {
    const out = [];
    let buffer = "";
    for (const ch of text) {
      buffer += ch;
      if (".!?…".includes(ch) || (buffer.length > 32 && ch === ",")) {
        out.push(buffer);
        buffer = "";
      }
    }
    if (buffer.trim()) out.push(buffer);
    return out.map((s) => s.trim()).filter(Boolean);
  }

  function utter(text, lang, tone) {
    const isEn = lang === "en";
    const preset = TONES[tone] || TONES.normal;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = isEn ? "en-US" : "ko-KR";
    u.rate = isEn ? preset.rate * 0.88 : preset.rate;   // 영어는 조금 더 또박또박
    u.pitch = preset.pitch;
    u.volume = 1;
    const voice = isEn ? chosen.en : chosen.ko;
    if (voice) u.voice = voice;
    return u;
  }

  function say(parts, tone) {
    if (!synth || muted) return;
    const list = (Array.isArray(parts) ? parts : [parts])
      .map((p) => (typeof p === "string" ? { text: p, lang: "ko" } : p))
      .filter((p) => p && p.text);
    if (!list.length) return;

    synth.cancel();
    list.forEach((part) => {
      const text = clean(part.text);
      if (!text) return;
      const partTone = part.tone || tone;
      const pieces = part.lang === "en" ? [text] : toChunks(text);
      pieces.forEach((piece) => synth.speak(utter(piece, part.lang, partTone)));
    });
  }

  function stop() {
    if (synth) synth.cancel();
  }

  function toggleMute() {
    muted = !muted;
    Store.set(MUTE_KEY, muted ? "1" : "0");
    if (muted) stop();
    return muted;
  }

  // 목소리 고르기 화면에서 쓴다.
  function koreanVoices() {
    pickVoices();
    return byLang("ko")
      .slice()
      .sort((a, b) => scoreVoice(b) - scoreVoice(a))
      .map((v) => ({ name: v.name, local: v.localService, current: chosen.ko && v.name === chosen.ko.name }));
  }

  function setVoice(name) {
    Store.set(VOICE_KEY, name);
    pickVoices();
  }

  return {
    say,
    stop,
    toggleMute,
    isMuted: () => muted,
    supported: !!synth,
    koreanVoices,
    setVoice,
    currentVoice: () => (chosen.ko ? chosen.ko.name : null)
  };
})();

// ---- js/app.js ----
const app = document.getElementById("app");
const soundToggle = document.getElementById("sound-toggle");

const ROSTER_KEY = "kidsquiz.roster";
const MODE_KEY = "kidsquiz.listenMode";
const MAX_PLAYERS = 6;
const MIN_AGE = 3;
const MAX_AGE = 10;
const DEFAULT_AGE = 6;
const AVATARS = ["🦊", "🐻", "🐼", "🐯", "🐸", "🦄"];

// 놀이 진행 순서. 끝까지 가면 다시 처음부터 돈다.
const CYCLE = ["quiz", "quiz", "english", "wordchain", "quiz", "story", "quiz", "english", "phrase", "quiz", "wordchain", "story"];

const state = {
  players: [],      // 비어 있으면 '다같이' 모드
  turnIndex: 0,
  teamStars: 0,
  planIndex: 0,
  lastKind: null,
  story: null,
  storySeg: 0,
  profileIndex: 0,
  ageDraft: DEFAULT_AGE,
  recent: [],
  recentStories: [],
  // 차 안에서는 화면을 안 보고 소리만 듣고 푸는 문제만 낸다.
  listenMode: Store.get(MODE_KEY) !== "0",
  chainWord: null,
  chainUsed: [],
  chainRound: 0
};

// 같은 칭찬만 반복하면 기계처럼 들려서, 매번 다르게 말해 준다.
const PRAISE = [
  "우와, 맞았어!",
  "딩동댕! 잘했어!",
  "오, 정확해!",
  "정말 잘하는구나!",
  "맞았어! 대단한걸?",
  "그렇지! 바로 그거야!"
];

const CONSOLE_LINES = [
  "아쉽다! 그래도 잘 들었어.",
  "괜찮아, 이런 것도 있구나!",
  "거의 다 왔는데! 괜찮아.",
  "음, 아쉽다! 다음엔 맞힐 거야."
];

// ---- 공통 도우미 ----

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function vocative(name) {
  return name + (hasBatchim(name) ? "아" : "야");
}

function avatarOf(index) {
  return AVATARS[index % AVATARS.length];
}

// 가끔은 이름을 불러 준다. ("아린아, 우와 맞았어!")
function praiseLine() {
  const line = pick(PRAISE);
  if (isTeamMode() || Math.random() < 0.5) return line;
  return `${vocative(currentLabel())}, ${line}`;
}

function consoleLine() {
  return pick(CONSOLE_LINES);
}

function isTeamMode() {
  return state.players.length === 0;
}

function currentPlayer() {
  return isTeamMode() ? null : state.players[state.turnIndex % state.players.length];
}

function currentAge() {
  const player = currentPlayer();
  return player ? player.age : DEFAULT_AGE;
}

function currentLabel() {
  const player = currentPlayer();
  return player ? player.name : "다같이";
}

function currentAvatar() {
  return isTeamMode() ? "🧒" : avatarOf(state.turnIndex % state.players.length);
}

function addStar() {
  const player = currentPlayer();
  if (player) player.stars++;
  else state.teamStars++;
}

function totalStars() {
  return isTeamMode() ? state.teamStars : state.players.reduce((sum, p) => sum + p.stars, 0);
}

function advanceTurn() {
  if (!isTeamMode()) state.turnIndex = (state.turnIndex + 1) % state.players.length;
}

function saveRoster() {
  const roster = state.players.map((p) => ({ name: p.name, age: p.age }));
  Store.set(ROSTER_KEY, JSON.stringify(roster));
}

function loadRoster() {
  try {
    const raw = JSON.parse(Store.get(ROSTER_KEY) || "[]");
    return Array.isArray(raw) && raw.length ? raw : null;
  } catch {
    return null;
  }
}

function bind(selector, handler, event) {
  app.querySelectorAll(selector).forEach((el) => el.addEventListener(event || "click", handler));
}

function show(html) {
  app.innerHTML = html;
  app.scrollTop = 0;
}

let pendingTimer = null;
let navLockUntil = 0;

// 아이들이 버튼을 연타해도 화면이 두 칸씩 넘어가지 않게 한다.
function navOnce(fn) {
  return () => {
    const now = Date.now();
    if (now < navLockUntil) return;
    navLockUntil = now + 400;
    fn();
  };
}

// 화면을 바꿀 때 예약된 진행을 취소한다. (남아 있으면 다음 화면을 건너뛰어 버린다)
function goto(screen) {
  Speech.stop();
  if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
  screen();
}

// 최근에 낸 문제는 잠시 피한다.
function freshQuestion(builder) {
  let question = builder();
  for (let i = 0; i < 12 && state.recent.includes(question.key); i++) question = builder();
  state.recent.push(question.key);
  if (state.recent.length > 25) state.recent.shift();
  return question;
}

function freshStory() {
  let story = pick(STORIES);
  for (let i = 0; i < 8 && state.recentStories.includes(story.title); i++) story = pick(STORIES);
  state.recentStories.push(story.title);
  if (state.recentStories.length > 3) state.recentStories.shift();
  return story;
}

// ---- 시작 화면 ----

function screenWelcome() {
  const roster = loadRoster();
  show(`
    <section class="card center">
      <div class="hero">🎈</div>
      <h1 class="title">같이 놀자!</h1>
      <p class="sub">퀴즈도 내고, 이야기도 들려주고,<br>영어도 알려줄게요.</p>
      <button class="btn primary big" data-act="quick">바로 시작하기</button>
      <button class="btn ghost" data-act="named">
        이름 알려주고 시작하기
        <span class="hint">이름을 알려주면 차례대로 불러 줄게요</span>
      </button>
      ${roster ? `
        <button class="btn ghost small" data-act="resume">
          지난번 친구들로 시작
          <span class="hint">${escapeHtml(roster.map((p) => `${p.name}(${p.age}살)`).join(", "))}</span>
        </button>` : ""}
    </section>
  `);

  bind('[data-act="quick"]', () => {
    state.players = [];
    startSession();
  });
  bind('[data-act="named"]', () => {
    state.players = [];
    goto(screenCount);
  });
  bind('[data-act="resume"]', () => {
    state.players = roster.map((p) => ({ name: p.name, age: p.age, stars: 0 }));
    startSession();
  });

  Speech.say(["안녕! 나랑 같이 놀래?", "바로 시작하기를 눌러도 되고, 이름을 알려줘도 좋아."]);
}

function screenCount() {
  const buttons = Array.from({ length: MAX_PLAYERS }, (_, i) => i + 1)
    .map((n) => `<button class="count-btn" data-count="${n}"><span class="count-num">${n}</span><span class="count-label">명</span></button>`)
    .join("");

  show(`
    <section class="card">
      <h2 class="ask">지금 몇 명이 함께 있어?</h2>
      <div class="count-grid">${buttons}</div>
      <button class="btn ghost small" data-act="skip">그냥 다같이 놀기</button>
    </section>
  `);

  bind("[data-count]", (e) => {
    const count = Number(e.currentTarget.dataset.count);
    state.players = Array.from({ length: count }, () => ({ name: "", age: DEFAULT_AGE, stars: 0 }));
    state.profileIndex = 0;
    goto(screenName);
  });
  bind('[data-act="skip"]', () => {
    state.players = [];
    startSession();
  });

  Speech.say("지금 몇 명이 함께 있어? 사람 수를 눌러 줘.");
}

function screenName() {
  const index = state.profileIndex;
  const roster = loadRoster() || [];
  const chips = roster
    .filter((p) => p.name)
    .map((p) => `<button class="chip" data-name="${escapeHtml(p.name)}">${escapeHtml(p.name)}</button>`)
    .join("");

  show(`
    <section class="card">
      <p class="step">${index + 1}번째 친구</p>
      <h2 class="ask">이름이 뭐야?</h2>
      <input class="name-input" id="nameInput" type="text" maxlength="10" autocomplete="off" placeholder="이름을 적어 주세요">
      ${chips ? `<div class="chips"><span class="chips-label">지난번 친구</span>${chips}</div>` : ""}
      <button class="btn primary" data-act="next">다음</button>
      <button class="btn ghost small" data-act="skip">이름 없이 그냥 놀기</button>
    </section>
  `);

  const input = app.querySelector("#nameInput");
  input.focus();

  const submit = () => {
    const name = input.value.trim();
    if (!name) {
      input.classList.add("shake");
      setTimeout(() => input.classList.remove("shake"), 400);
      Speech.say("이름을 적어 줘.");
      return;
    }
    state.players[index].name = name;
    state.ageDraft = DEFAULT_AGE;
    goto(screenAge);
  };

  bind('[data-act="next"]', submit);
  bind('[data-act="skip"]', () => {
    state.players = [];
    startSession();
  });
  bind(".chip", (e) => { input.value = e.currentTarget.dataset.name; });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });

  Speech.say(`${index + 1}번째 친구, 이름이 뭐야? 어른이 적어 줘도 좋아.`);
}

function screenAge() {
  const player = state.players[state.profileIndex];
  const name = player.name;

  const draw = () => {
    show(`
      <section class="card">
        <h2 class="ask">${escapeHtml(name)}${particle(name, "은는")} 몇 살이야?</h2>
        <div class="stepper">
          <button class="step-btn" data-delta="-1" aria-label="나이 줄이기">−</button>
          <div class="age-display"><span class="age-num">${state.ageDraft}</span><span class="age-unit">살</span></div>
          <button class="step-btn" data-delta="1" aria-label="나이 늘리기">＋</button>
        </div>
        <button class="btn primary" data-act="next">다음</button>
      </section>
    `);

    bind("[data-delta]", (e) => {
      state.ageDraft = Math.min(MAX_AGE, Math.max(MIN_AGE, state.ageDraft + Number(e.currentTarget.dataset.delta)));
      draw();
      Speech.say(`${state.ageDraft}살`);
    });

    bind('[data-act="next"]', () => {
      player.age = state.ageDraft;
      state.profileIndex++;
      if (state.profileIndex < state.players.length) goto(screenName);
      else { saveRoster(); startSession(); }
    });
  };

  draw();
  Speech.say(`${name}${particle(name, "은는")} 몇 살이야?`);
}

// ---- 놀이 진행 ----

// 차 안에서 노는 동안 화면이 꺼지지 않게 한다.
let wakeLock = null;

async function keepAwake() {
  if (!("wakeLock" in navigator) || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch {
    wakeLock = null;
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});

function startSession() {
  keepAwake();
  state.turnIndex = 0;
  state.teamStars = 0;
  state.planIndex = 0;
  state.lastKind = null;
  state.recent = [];
  state.players.forEach((p) => { p.stars = 0; });
  goto(screenHello);
}

function screenHello() {
  const who = isTeamMode() ? "친구들" : state.players.map((p) => p.name).join(", ");
  show(`
    <section class="card center">
      <div class="hero">👋</div>
      <h2 class="title">안녕, ${escapeHtml(who)}!</h2>
      <p class="sub">${isTeamMode() ? "오늘은 다같이 놀자." : "한 명씩 차례대로 물어볼게."}<br>퀴즈도 풀고, 이야기도 듣고, 영어도 해보자!</p>
      <button class="btn primary big" data-act="go">좋아, 놀자!</button>
    </section>
  `);

  bind('[data-act="go"]', navOnce(nextStep));
  Speech.say([`안녕, ${who}!`, "오늘은 나랑 같이 놀자.", "퀴즈도 내고, 재미있는 이야기도 들려줄게."], "warm");
}

function nextStep() {
  const kind = CYCLE[state.planIndex % CYCLE.length];
  state.planIndex++;
  runActivity(kind);
}

function runActivity(kind, skipIntro) {
  const changed = kind !== state.lastKind;
  state.lastKind = kind;
  if (changed && !skipIntro && kind !== "quiz") goto(() => screenTransition(kind));
  else goto(() => startActivity(kind));
}

function startActivity(kind) {
  if (kind === "story") startStory();
  else if (kind === "english") screenEnglish();
  else if (kind === "phrase") screenPhrase();
  else if (kind === "wordchain") startWordChain();
  else screenQuiz();
}

function screenTransition(kind) {
  const who = isTeamMode() ? "얘들아" : vocative(currentLabel());
  const cards = {
    story: { emoji: "📖", title: "이야기 들려줄게!", sub: "편하게 듣기만 하면 돼.", line: `${who}, 이번엔 재미있는 이야기 하나 들려줄게.` },
    english: { emoji: "🔤", title: "이번엔 영어 놀이!", sub: "영어로 뭐라고 하는지 맞혀 보자.", line: `${who}, 이번엔 영어로 놀아 볼까?` },
    phrase: { emoji: "🗣️", title: "따라 말하기!", sub: "내가 말하면 큰 소리로 따라 해 봐.", line: `${who}, 내가 하는 말을 따라 해 볼래?` },
    wordchain: { emoji: "🔗", title: "끝말잇기 하자!", sub: "내가 말하면 이어지는 말을 골라 봐.", line: `${who}, 우리 끝말잇기 할까?` }
  };
  const card = cards[kind];

  show(`
    <section class="card center">
      <div class="hero">${card.emoji}</div>
      <h2 class="title">${card.title}</h2>
      <p class="sub">${card.sub}</p>
      <button class="btn primary big" data-act="go">좋아!</button>
      <button class="btn ghost small" data-act="hub">다른 놀이 할래</button>
    </section>
  `);

  bind('[data-act="go"]', navOnce(() => goto(() => startActivity(kind))));
  bind('[data-act="hub"]', () => goto(screenHub));
  Speech.say(card.line);
}

// ---- 문제 내기 ----

function topBar() {
  return `
    <header class="quiz-top">
      <button class="pill-btn" data-act="hub">🎪 놀이 바꾸기</button>
      <span class="star-count">⭐ ${totalStars()}</span>
      <button class="pill-btn" data-act="replay">🔊 다시</button>
    </header>`;
}

function bindTopBar(onReplay) {
  bind('[data-act="hub"]', () => goto(screenHub));
  bind('[data-act="replay"]', onReplay);
}

function choiceHtml(q) {
  return q.choices
    .map((choice, i) => {
      if (q.choiceStyle === "color") {
        return `<button class="choice choice--color" data-i="${i}" style="background:${choice.hex}" aria-label="${choice.name}"></button>`;
      }
      if (q.choiceStyle === "shape") {
        return `<button class="choice choice--shape" data-i="${i}">${choice}</button>`;
      }
      if (q.choiceStyle === "emoji") {
        return `<button class="choice choice--emoji" data-i="${i}">${choice}</button>`;
      }
      if (q.choiceStyle === "group") {
        return `<button class="choice choice--group" data-i="${i}">${choice}</button>`;
      }
      if (q.choiceStyle === "number") {
        const n = Number(choice);
        const dots = q.dots && n > 0 && n <= 12 ? `<span class="dotrow">${"●".repeat(n)}</span>` : "";
        return `<button class="choice choice--number" data-i="${i}"><span class="digit">${choice}</span>${dots}</button>`;
      }
      return `<button class="choice choice--text" data-i="${i}"><span class="badge">${i + 1}</span>${escapeHtml(choice)}</button>`;
    })
    .join("");
}

function answerLabel(q) {
  if (q.answerLabel) return q.answerLabel;
  const correct = q.choices[q.answer];
  if (q.choiceStyle === "color") return correct.name;
  if (q.choiceStyle === "shape") {
    const found = SHAPES.find((s) => s.glyph === correct);
    return found ? found.name : "이 모양";
  }
  if (q.choiceStyle === "group") return "더 많은 쪽";
  return correct;
}

function speakQuestion(q, prefix) {
  const parts = [];
  if (prefix) parts.push({ text: prefix, lang: "ko" });
  if (q.speakParts) parts.push(...q.speakParts);
  else parts.push({ text: q.speak || q.prompt, lang: "ko" });
  // 글자·숫자 보기는 소리만 듣고도 고를 수 있게 번호와 함께 읽어 준다.
  if (q.choiceStyle === "text" || q.choiceStyle === "number") {
    q.choices.forEach((choice, i) => {
      parts.push({ text: `${i + 1}번,`, lang: "ko" });
      parts.push({ text: choice, lang: q.choiceLang || "ko" });
    });
  }
  Speech.say(parts);
}

function markAnswer(q, picked) {
  [...app.querySelectorAll(".choice")].forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add("correct");
    else if (i === picked) btn.classList.add("wrong");
  });
}

function askQuestion(q, options) {
  const opts = options || {};
  const label = currentLabel();
  const prefix = (!isTeamMode() && opts.turn) ? `${vocative(label)},` : null;

  show(`
    <section class="quiz">
      ${topBar()}
      <div class="card quiz-card">
        <p class="who-line">${currentAvatar()} ${escapeHtml(isTeamMode() ? "다같이!" : label + " 차례!")}</p>
        ${q.visual ? `<div class="visual ${q.visualClass || ""}">${q.visual}</div>` : ""}
        <h2 class="question">${escapeHtml(q.prompt)}</h2>
        <div class="choices choices--${q.choiceStyle}">${choiceHtml(q)}</div>
        ${state.listenMode ? '<button class="btn ghost small" id="revealBtn" data-act="reveal">🙉 정답 알려줘</button>' : ""}
        <div class="feedback" id="feedback"></div>
      </div>
    </section>
  `);

  const hideReveal = () => {
    const btn = app.querySelector("#revealBtn");
    if (btn) btn.hidden = true;
  };

  bindTopBar(() => speakQuestion(q, prefix));

  // 아무도 화면을 안 볼 때: 정답만 듣고 맞혔는지 스스로 알려 주는 길
  bind('[data-act="reveal"]', navOnce(() => {
    hideReveal();
    [...app.querySelectorAll(".choice")].forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add("correct");
    });
    const label = answerLabel(q);
    app.querySelector("#feedback").innerHTML = `
      <p class="fb ok">정답은 ${escapeHtml(label)}!</p>
      <div class="fb-row">
        <button class="btn primary" data-act="got">맞혔어! ⭐</button>
        <button class="btn ghost" data-act="missed">아쉽다</button>
      </div>
    `;
    Speech.say([
      { text: "정답은", lang: "ko" },
      { text: label, lang: q.choiceLang || "ko" },
      { text: "맞혔어?", lang: "ko" }
    ], "gentle");
    bind('[data-act="got"]', navOnce(() => {
      addStar();
      finishTurn(opts);
    }));
    bind('[data-act="missed"]', navOnce(() => finishTurn(opts)));
  }));

  bind(".choice", (e) => {
    hideReveal();
    const picked = Number(e.currentTarget.dataset.i);
    const correct = picked === q.answer;
    markAnswer(q, picked);
    if (correct) addStar();

    const label2 = answerLabel(q);
    const answerLang = q.choiceLang || "ko";
    const line = correct ? praiseLine() : consoleLine();

    app.querySelector("#feedback").innerHTML = `
      <p class="fb ${correct ? "ok" : "no"}">${escapeHtml(correct ? `${line} 🎉` : `${line} 정답은 ${label2}!`)}</p>
      <button class="btn primary" data-act="next">다음!</button>
    `;
    app.querySelector(".star-count").textContent = `⭐ ${totalStars()}`;

    Speech.say(
      correct
        ? [{ text: line, lang: "ko" }, ...(answerLang === "en" ? [{ text: label2, lang: "en" }] : [])]
        : [{ text: `${line} 정답은`, lang: "ko" }, { text: label2, lang: answerLang }],
      correct ? "happy" : "gentle"
    );

    bind('[data-act="next"]', navOnce(() => finishTurn(opts)));
  });

  speakQuestion(q, prefix);
}

function finishTurn(opts) {
  if (opts.onDone) opts.onDone();
  else { advanceTurn(); nextStep(); }
}

function nextQuizQuestion() {
  const age = currentAge();
  if (!state.listenMode) return buildSingleQuestion(age);
  if (Math.random() < 0.25) {
    const bank = curatedForAge(age);
    if (bank.length) return pick(bank);
  }
  return buildListenQuestion(age);
}

function screenQuiz() {
  askQuestion(freshQuestion(nextQuizQuestion), { turn: true });
}

function screenEnglish() {
  const build = state.listenMode
    ? buildListenEnglishQuestion
    : () => buildEnglishQuestion(currentAge());
  askQuestion(freshQuestion(build), { turn: true });
}

// ---- 끝말잇기 ----

function startWordChain() {
  state.chainUsed = [];
  state.chainRound = 0;
  state.chainWord = chainStartWord([]);
  state.chainUsed.push(state.chainWord);
  screenWordChain(true);
}

function screenWordChain(first) {
  const word = state.chainWord;
  const last = word[word.length - 1];
  const options = chainOptions(word, state.chainUsed);

  if (!options.length || state.chainRound >= 4) {
    goto(screenWordChainEnd);
    return;
  }

  const correct = chainPick(word, state.chainUsed) || pick(options);
  const distractors = shuffle(
    WORD_CHAIN.filter((w) => w[0] !== last && !state.chainUsed.includes(w))
  ).slice(0, 2);
  const choices = shuffle([correct, ...distractors]);
  const answer = choices.indexOf(correct);

  show(`
    <section class="quiz">
      ${topBar()}
      <div class="card quiz-card center">
        <p class="who-line">🔗 끝말잇기</p>
        <p class="chain-word">${escapeHtml(word)}</p>
        <h2 class="question">"${escapeHtml(last)}"${roParticle(last)} 시작하는 말은?</h2>
        <div class="choices choices--text">
          ${choices.map((w, i) => `<button class="choice choice--text" data-i="${i}"><span class="badge">${i + 1}</span>${escapeHtml(w)}</button>`).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    </section>
  `);

  const speakIt = () => Speech.say([
    ...(first ? ["끝말잇기 하자! 내가 먼저 할게."] : []),
    `${word}!`,
    `${last}${roParticle(last)} 시작하는 말은 뭘까?`,
    ...choices.map((w, i) => `${i + 1}번, ${w}.`)
  ]);

  bindTopBar(speakIt);
  bind(".choice", (e) => {
    const picked = Number(e.currentTarget.dataset.i);
    const ok = picked === answer;
    [...app.querySelectorAll(".choice")].forEach((btn, i) => {
      btn.disabled = true;
      if (i === answer) btn.classList.add("correct");
      else if (i === picked) btn.classList.add("wrong");
    });
    if (ok) addStar();
    app.querySelector(".star-count").textContent = `⭐ ${totalStars()}`;

    state.chainUsed.push(correct);
    state.chainRound++;

    // 내 차례: 고른 낱말 뒤를 내가 이어 붙인다.
    const myWord = chainPick(correct, state.chainUsed);
    if (myWord) {
      state.chainUsed.push(myWord);
      state.chainWord = myWord;
    }

    const head = ok
      ? `맞았어! ${correct}!`
      : `${last}${roParticle(last)} 시작하는 말은 ${correct}${hasBatchim(correct) ? "이야" : "야"}!`;
    const tail = myWord ? ` 그럼 나는 ${myWord}!` : " 여기서 끝! 잘했어!";

    app.querySelector("#feedback").innerHTML = `
      <p class="fb ${ok ? "ok" : "no"}">${escapeHtml(head + tail)}</p>
      <button class="btn primary" data-act="next">${myWord ? "계속 이어가기" : "끝!"}</button>
    `;
    Speech.say([head + tail], ok ? "happy" : "gentle");

    bind('[data-act="next"]', navOnce(() => {
      if (myWord) goto(() => screenWordChain(false));
      else goto(screenWordChainEnd);
    }));
  });

  speakIt();
}

function screenWordChainEnd() {
  const count = state.chainUsed.length;
  show(`
    <section class="card center">
      <div class="hero">🔗</div>
      <h2 class="title">${count}개나 이어갔어!</h2>
      <p class="chain-trail">${state.chainUsed.map((w) => escapeHtml(w)).join(" → ")}</p>
      <button class="btn primary big" data-act="next">다음 놀이!</button>
    </section>
  `);

  bind('[data-act="next"]', navOnce(() => { advanceTurn(); nextStep(); }));
  Speech.say([`우와, 낱말을 ${count}개나 이어갔어! 잘했어!`]);
}

// ---- 이야기 ----

function startStory() {
  state.story = freshStory();
  state.storySeg = 0;
  screenStory();
}

function screenStory() {
  const story = state.story;
  const segment = story.segments[state.storySeg];
  const last = state.storySeg === story.segments.length - 1;

  show(`
    <section class="quiz">
      ${topBar()}
      <div class="card story-card">
        <div class="story-emoji">${story.emoji}</div>
        <h2 class="story-title">${escapeHtml(story.title)}</h2>
        <p class="story-text">${escapeHtml(segment)}</p>
        <p class="story-progress">${story.segments.map((_, i) => (i <= state.storySeg ? "●" : "○")).join(" ")}</p>
        <button class="btn primary" data-act="next">${last ? "다 들었어!" : "그래서 어떻게 됐어?"}</button>
      </div>
    </section>
  `);

  bindTopBar(() => Speech.say(segment));
  bind('[data-act="next"]', navOnce(() => {
    if (last) goto(askStoryQuestion);
    else { state.storySeg++; goto(screenStory); }
  }));

  Speech.say(state.storySeg === 0 ? [`${story.title}.`, segment] : segment, "warm");
}

function askStoryQuestion() {
  const story = state.story;
  askQuestion({
    kind: "story",
    prompt: story.question.prompt,
    visual: `<span>${story.emoji}</span>`,
    visualClass: "visual-emoji",
    choices: story.question.choices,
    answer: story.question.answer,
    choiceStyle: "text",
    key: `story-${story.title}`
  }, { onDone: () => goto(screenStoryTalk) });
}

function screenStoryTalk() {
  const story = state.story;
  show(`
    <section class="card center">
      <div class="hero">💬</div>
      <h2 class="title">우리 이야기해 볼까?</h2>
      <p class="talk-text">${escapeHtml(story.talk)}</p>
      <button class="btn primary big" data-act="next">이야기했어!</button>
    </section>
  `);

  bind('[data-act="next"]', navOnce(() => { advanceTurn(); nextStep(); }));
  Speech.say(story.talk, "warm");
}

// ---- 따라 말하기 ----

function screenPhrase() {
  const phrase = pickPhrase();
  const speakIt = () => Speech.say([
    { text: "따라 해 볼까?", lang: "ko" },
    { text: phrase.en, lang: "en" },
    { text: phrase.ko, lang: "ko" },
    { text: phrase.en, lang: "en" }
  ]);

  show(`
    <section class="quiz">
      ${topBar()}
      <div class="card center phrase-card">
        <div class="hero">🗣️</div>
        <p class="phrase-en">${escapeHtml(phrase.en)}</p>
        <p class="phrase-ko">${escapeHtml(phrase.ko)}</p>
        <button class="btn primary big" data-act="done">따라 했어요!</button>
      </div>
    </section>
  `);

  bindTopBar(speakIt);
  bind('[data-act="done"]', (e) => {
    e.currentTarget.disabled = true;
    addStar();
    app.querySelector(".star-count").textContent = `⭐ ${totalStars()}`;
    Speech.say([{ text: pick(["잘했어! 멋지다!", "우와, 발음 좋은데?", "그렇지! 아주 좋아!"]), lang: "ko" }], "happy");
    advanceTurn();
    pendingTimer = setTimeout(nextStep, 900);
  });

  speakIt();
}

// ---- 놀이 고르기 / 마무리 ----

function screenHub() {
  const items = [
    { kind: "quiz", emoji: "🔢", label: "퀴즈 풀기" },
    { kind: "wordchain", emoji: "🔗", label: "끝말잇기" },
    { kind: "story", emoji: "📖", label: "이야기 듣기" },
    { kind: "english", emoji: "🔤", label: "영어 놀이" },
    { kind: "phrase", emoji: "🗣️", label: "따라 말하기" }
  ].map((item) => `
    <button class="hub-btn" data-kind="${item.kind}">
      <span class="hub-emoji">${item.emoji}</span>
      <span class="hub-label">${item.label}</span>
    </button>`).join("");

  show(`
    <section class="card center">
      <h2 class="ask">무슨 놀이 할까?</h2>
      <div class="hub-grid">${items}</div>
      <button class="btn mode" data-act="mode">
        ${state.listenMode ? "🚗 듣기 모드 (차 안에서)" : "👀 화면 모드 (그림 문제도)"}
        <span class="hint">${state.listenMode ? "소리만 듣고 풀 수 있는 문제만 나와요" : "색깔·그림처럼 화면을 봐야 하는 문제도 나와요"}</span>
      </button>
      <button class="btn ghost small" data-act="voice">🎤 목소리 고르기</button>
      <button class="btn ghost" data-act="back">계속 이어서 놀기</button>
      <button class="btn ghost small" data-act="finish">오늘은 여기까지</button>
    </section>
  `);

  bind('[data-act="voice"]', () => goto(screenVoice));

  bind('[data-act="mode"]', () => {
    state.listenMode = !state.listenMode;
    Store.set(MODE_KEY, state.listenMode ? "1" : "0");
    goto(screenHub);
  });

  bind("[data-kind]", (e) => {
    const kind = e.currentTarget.dataset.kind;
    goto(() => { state.lastKind = kind; startActivity(kind); });
  });
  bind('[data-act="back"]', navOnce(nextStep));
  bind('[data-act="finish"]', () => goto(screenTally));

  Speech.say("무슨 놀이 할까? 숫자 퀴즈, 이야기, 영어 놀이, 따라 말하기 중에 골라 봐.");
}

let voicePreview = false;

function screenVoice() {
  const voices = Speech.koreanVoices();

  const list = voices.length
    ? voices.map((v, i) => `
        <button class="voice-btn ${v.current ? "current" : ""}" data-voice="${escapeHtml(v.name)}">
          <span class="voice-name">${escapeHtml(v.name)}</span>
          <span class="voice-tag">${v.current ? "지금 이 목소리" : "눌러서 들어보기"}</span>
        </button>`).join("")
    : `<p class="sub">이 기기에서 한국어 목소리를 찾지 못했어요.</p>`;

  show(`
    <section class="card center">
      <div class="hero">🎤</div>
      <h2 class="title">목소리 고르기</h2>
      <p class="sub">눌러서 들어보고 마음에 드는 목소리를 고르세요.<br>
        <small>폰 설정에서 고품질 한국어 음성을 받으면 훨씬 자연스러워요.</small></p>
      <div class="voice-list">${list}</div>
      <button class="btn primary" data-act="back">다 골랐어요</button>
    </section>
  `);

  bind("[data-voice]", (e) => {
    Speech.setVoice(e.currentTarget.dataset.voice);
    voicePreview = true;
    screenVoice();   // goto를 쓰면 방금 시작한 미리듣기가 끊긴다
  });
  bind('[data-act="back"]', () => goto(screenHub));

  Speech.say(
    voicePreview
      ? ["안녕! 나는 이런 목소리야.", "오늘도 같이 재미있게 놀자!"]
      : "어떤 목소리가 좋아? 눌러서 들어봐.",
    "warm"
  );
  voicePreview = false;
}

function screenTally() {
  const body = isTeamMode()
    ? `<div class="stars">${"⭐".repeat(Math.min(state.teamStars, 10))}</div>
       <h2 class="title">별 ${state.teamStars}개 모았어!</h2>`
    : `<h2 class="title">오늘 이만큼 모았어!</h2>
       <ul class="result-list">${state.players.map((p, i) => `
         <li>
           <span class="who">${avatarOf(i)} ${escapeHtml(p.name)} <small>${p.age}살</small></span>
           <span class="tally">⭐ ${p.stars}</span>
         </li>`).join("")}</ul>`;

  show(`
    <section class="card center">
      <div class="hero">🏆</div>
      ${body}
      <p class="sub">다음에 또 놀자!</p>
      <button class="btn primary big" data-act="more">더 놀래!</button>
      <button class="btn ghost small" data-act="home">처음으로</button>
    </section>
  `);

  bind('[data-act="more"]', navOnce(nextStep));
  bind('[data-act="home"]', () => goto(screenWelcome));

  const summary = isTeamMode()
    ? `오늘 별 ${state.teamStars}개를 모았어!`
    : state.players.map((p) => `${p.name}, 별 ${p.stars}개.`).join(" ");
  Speech.say(["오늘 정말 잘했어!", summary, "다음에 또 놀자!"], "warm");
}

// ---- 시작 ----

function updateSoundIcon() {
  soundToggle.textContent = Speech.isMuted() ? "🔇" : "🔊";
}

soundToggle.addEventListener("click", () => {
  Speech.toggleMute();
  updateSoundIcon();
});

if (!Speech.supported) soundToggle.hidden = true;
updateSoundIcon();
goto(screenWelcome);

</script>
